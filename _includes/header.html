<header class="site-header">
  <div class="wrap">
    <div class="profile-row">
      <img class="avatar" src="{{ site.avatar_url }}" alt="{{ site.author }}" width="48" height="48" loading="lazy">
      <div class="profile-id">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }}</a>
        <div class="profile-sub">
          <a class="handle" href="https://github.com/{{ site.github_username }}">@{{ site.github_username }}</a>
          <span class="role">{{ site.role }}</span>
        </div>
      </div>
    </div>
    <p class="tagline">{{ site.tagline }}</p>
    <nav class="cat-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>All posts</a>
      {% for cat in site.categories_list %}
      <a href="{{ '/categories/' | append: cat.slug | append: '/' | relative_url }}"{% if page.category_slug == cat.slug %} class="active"{% endif %}>{{ cat.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
